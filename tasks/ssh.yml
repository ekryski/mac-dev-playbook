---
- name: Ensure ~/.ssh exists with the right permissions.
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.ssh"
    state: directory
    mode: "0700"

# ed25519 over RSA: shorter, faster, and what GitHub recommends today.
# `creates` makes this a no-op once the key exists, so an existing key is never
# overwritten -- which would be an unrecoverable mistake.
- name: Generate an SSH key pair if one does not already exist.
  ansible.builtin.command:
    cmd: >-
      ssh-keygen -t {{ ssh_key_type }} -N ''
      -C {{ ssh_key_comment | quote }}
      -f {{ (ssh_key_path | expanduser) | quote }}
    creates: "{{ ssh_key_path | expanduser }}"

- name: Ensure the private key is only readable by you.
  ansible.builtin.file:
    path: "{{ ssh_key_path | expanduser }}"
    mode: "0600"

# AddKeysToAgent + UseKeychain means you unlock the key once and macOS remembers
# it across reboots, rather than prompting on every git push.
- name: Configure the SSH client.
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts.env.HOME }}/.ssh/config"
    create: true
    mode: "0600"
    marker: "# {mark} ANSIBLE MANAGED: mac-dev-playbook"
    block: |
      Host *
        AddKeysToAgent yes
        UseKeychain yes
        IdentityFile {{ ssh_key_path }}
        IdentitiesOnly yes

      Host github.com
        HostName github.com
        User git
        IdentityFile {{ ssh_key_path }}

- name: Add the key to the ssh-agent and the login keychain.
  ansible.builtin.command:
    cmd: "ssh-add --apple-use-keychain {{ (ssh_key_path | expanduser) | quote }}"
  register: ssh_add
  changed_when: "'Identity added' in ssh_add.stderr or 'Identity added' in ssh_add.stdout"
  failed_when: false

- name: Ensure github.com is a known host.
  ansible.builtin.known_hosts:
    name: github.com
    key: "{{ lookup('ansible.builtin.pipe', 'ssh-keyscan -t ed25519 github.com') }}"
    path: "{{ ansible_facts.env.HOME }}/.ssh/known_hosts"
  failed_when: false
