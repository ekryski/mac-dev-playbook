---
# Homebrew's `rustup` formula is keg-only (it conflicts with `rust`) and no
# longer ships `rustup-init`. The `rust` formula is deliberately NOT installed
# -- having both puts two rustc binaries on PATH and cargo picks the wrong one.
# cargo/rustc live in {{ homebrew_prefix }}/opt/rustup/bin; the dotfiles put
# that directory on PATH. `rustup` itself is also linked into homebrew_bin.
- name: Set the default toolchain.
  ansible.builtin.command:
    cmd: "{{ homebrew_bin }}/rustup default {{ rustup_default_toolchain }}"
  register: rustup_default
  changed_when: "'unchanged' not in rustup_default.stdout"

- name: Install rustup components.
  ansible.builtin.command:
    cmd: "{{ homebrew_bin }}/rustup component add {{ item }}"
  loop: "{{ rustup_components }}"
  register: rustup_component
  changed_when: "'installing' in rustup_component.stdout"
