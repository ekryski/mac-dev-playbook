---
# Homebrew's `rustup` formula is keg-only (it conflicts with `rust`) and no
# longer ships `rustup-init`. The `rust` formula is deliberately NOT installed
# -- having both puts two rustc binaries on PATH and cargo picks the wrong one.
# cargo/rustc live in {{ homebrew_prefix }}/opt/rustup/bin; the dotfiles
# .zprofile puts that directory on PATH, and the last task checks it did.
# `rustup` itself is also linked into homebrew_bin.
- name: Set the default toolchain.
  ansible.builtin.command:
    cmd: "{{ homebrew_bin }}/rustup default {{ rustup_default_toolchain }}"
  register: rustup_default
  changed_when: "'unchanged' not in rustup_default.stdout"

- name: Install rustup components.
  ansible.builtin.command:
    cmd: "{{ homebrew_bin }}/rustup component add {{ item }}"
  loop: "{{ rustup_components }}"
  register: rustup_component
  changed_when: "'installing' in rustup_component.stdout"

- name: Check rustc is on the login-shell PATH.
  ansible.builtin.command:
    cmd: zsh -lc 'command -v rustc'
  register: rustc_on_path
  changed_when: false
  failed_when: false

- name: Fail if rustc is not on PATH.
  ansible.builtin.assert:
    that: rustc_on_path.rc == 0
    fail_msg: >-
      rustc is installed but not on the login-shell PATH. Homebrew's rustup is
      keg-only; the dotfiles .zprofile must add {{ homebrew_prefix }}/opt/rustup/bin.
    success_msg: "rustc: {{ rustc_on_path.stdout }}"
