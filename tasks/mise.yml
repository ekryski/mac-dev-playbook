---
# mise is the single version manager for node, ruby and go. This file holds
# only your machine-wide defaults (mise_tools); each key is set in place, so a
# key you add by hand survives a run. Other tools keep their own files beside
# it: the Waffuru ops bootstrap writes conf.d/waffuru.toml, which this file
# overrides where both name a tool.
- name: Ensure the mise config directory exists.
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/mise"
    state: directory
    mode: "0755"

- name: Set the global mise tool versions.
  community.general.ini_file:
    path: "{{ ansible_facts.env.HOME }}/.config/mise/config.toml"
    section: tools
    option: "{{ item.key }}"
    value: "{{ item.value | to_json }}"
    mode: "0644"
  loop: "{{ mise_tools | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"

# Honour the version files other tools already write (.nvmrc, .node-version,
# .ruby-version, go.mod) so existing projects work without a .mise.toml.
- name: Read the version files other tools write.
  community.general.ini_file:
    path: "{{ ansible_facts.env.HOME }}/.config/mise/config.toml"
    section: settings
    option: idiomatic_version_file_enable_tools
    value: "{{ mise_idiomatic_version_files | to_json }}"
    mode: "0644"

# Ruby is compiled from source, so ruby-build needs to find Homebrew's OpenSSL
# and libyaml rather than the system ones.
- name: Install the configured mise tools.
  ansible.builtin.command:
    cmd: "{{ homebrew_bin }}/mise install --yes"
  environment:
    MISE_TRUSTED_CONFIG_PATHS: "{{ ansible_facts.env.HOME }}/.config/mise"
    RUBY_CONFIGURE_OPTS: "--with-openssl-dir={{ homebrew_prefix }}/opt/openssl@3"
    PKG_CONFIG_PATH: "{{ homebrew_prefix }}/opt/libyaml/lib/pkgconfig:{{ homebrew_prefix }}/opt/openssl@3/lib/pkgconfig"
  register: mise_install
  changed_when: "'Installing' in mise_install.stdout or 'installed' in mise_install.stdout"

# `mise install` stops at whatever already satisfies "26" or "3.4"; upgrade
# moves each tool to the newest release in that range and --prune removes the
# one it replaced.
- name: Upgrade mise tools to the newest release in their range.
  ansible.builtin.command:
    cmd: "{{ homebrew_bin }}/mise upgrade --yes --prune"
  environment:
    MISE_TRUSTED_CONFIG_PATHS: "{{ ansible_facts.env.HOME }}/.config/mise"
    RUBY_CONFIGURE_OPTS: "--with-openssl-dir={{ homebrew_prefix }}/opt/openssl@3"
    PKG_CONFIG_PATH: "{{ homebrew_prefix }}/opt/libyaml/lib/pkgconfig:{{ homebrew_prefix }}/opt/openssl@3/lib/pkgconfig"
  register: mise_upgrade
  changed_when: "'installed' in mise_upgrade.stdout or 'uninstalled' in mise_upgrade.stdout"
  when: runtimes_upgrade | bool

- name: Show the resolved tool versions.
  ansible.builtin.command:
    cmd: "{{ homebrew_bin }}/mise list --current"
  register: mise_list
  changed_when: false

- name: Report the active runtimes.
  ansible.builtin.debug:
    msg: "{{ mise_list.stdout_lines }}"

# Deliberately routed through `mise exec` so packages land in the active node
# installation rather than whatever npm happens to be first on PATH.
- name: Install global npm packages.
  ansible.builtin.command:
    cmd: "{{ homebrew_bin }}/mise exec -- npm install --global {{ item }}"
  loop: "{{ npm_global_packages }}"
  register: npm_global
  changed_when: "'added' in npm_global.stdout or 'changed' in npm_global.stdout"
  when: npm_global_packages | length > 0
