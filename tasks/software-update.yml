---
# These settings live in /Library/Preferences, so they need root. Current macOS
# reads com.apple.SoftwareUpdate AutomaticallyInstallAppUpdates for App Store
# app updates; older releases read com.apple.commerce AutoUpdate, so both are
# set. CriticalUpdateInstall and ConfigDataInstall cover Rapid Security
# Responses and the XProtect and Gatekeeper data files.
- name: Set the automatic update policy.
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: bool
    value: "{{ item.value }}"
    state: present
  become: true
  loop:
    - domain: /Library/Preferences/com.apple.SoftwareUpdate
      key: AutomaticCheckEnabled
      value: "{{ software_update_automatic_check }}"
    - domain: /Library/Preferences/com.apple.SoftwareUpdate
      key: AutomaticDownload
      value: "{{ software_update_automatic_download }}"
    - domain: /Library/Preferences/com.apple.SoftwareUpdate
      key: CriticalUpdateInstall
      value: "{{ software_update_install_security_responses }}"
    - domain: /Library/Preferences/com.apple.SoftwareUpdate
      key: ConfigDataInstall
      value: "{{ software_update_install_security_responses }}"
    - domain: /Library/Preferences/com.apple.SoftwareUpdate
      key: AutomaticallyInstallMacOSUpdates
      value: "{{ software_update_install_macos_updates }}"
    - domain: /Library/Preferences/com.apple.SoftwareUpdate
      key: AutomaticallyInstallAppUpdates
      value: "{{ software_update_install_app_updates }}"
    - domain: /Library/Preferences/com.apple.commerce
      key: AutoUpdate
      value: "{{ software_update_install_app_updates }}"
  loop_control:
    label: "{{ item.domain | basename }} {{ item.key }}={{ item.value }}"
