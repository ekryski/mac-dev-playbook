---
# ---------------------------------------------------------------------------
# Default configuration.
#
# Do not edit this file to customise your machine. Copy config.example.yml to
# config.yml and override only what you need there -- config.yml is gitignored
# and is loaded after this file, so anything it defines wins.
# ---------------------------------------------------------------------------

# Which sections of the playbook run. Each maps to a tag of the same name, so
# `ansible-playbook main.yml --tags homebrew` works regardless of these.
configure_xcode: true
configure_homebrew: true
configure_mas: true
configure_dotfiles: true
configure_git: true
configure_ssh: true
configure_mise: true
configure_python: true
configure_rust: true
configure_docker: true
configure_services: true
configure_macos_defaults: true

# ---------------------------------------------------------------------------
# Identity
#
# Used for the git config and the SSH key comment. Override in config.yml.
# ---------------------------------------------------------------------------
git_user_name: "Eric Kryski"
git_user_email: "599019+ekryski@users.noreply.github.com"

# GPG key used to sign commits. Leave empty to disable commit signing.
git_signing_key: ""

# ---------------------------------------------------------------------------
# Dotfiles
# ---------------------------------------------------------------------------
dotfiles_repo: "https://github.com/ekryski/dotfiles.git"
dotfiles_repo_version: "main"
dotfiles_repo_dest: "~/Development/personal/dotfiles"

# Cloned rather than using the official installer, which would overwrite .zshrc.
oh_my_zsh_repo: "https://github.com/ohmyzsh/ohmyzsh.git"
oh_my_zsh_version: "master"
oh_my_zsh_dest: "~/.oh-my-zsh"

# Files symlinked from the dotfiles repo into place. `src` is relative to the
# repo root, `dest` is relative to $HOME.
dotfiles_links:
  - { src: ".zshenv", dest: ".zshenv" }
  - { src: ".zprofile", dest: ".zprofile" }
  - { src: ".zshrc", dest: ".zshrc" }
  - { src: "zsh", dest: ".zsh" }
  - { src: ".gitconfig", dest: ".gitconfig" }
  - { src: ".gitignore_global", dest: ".gitignore_global" }
  - { src: ".inputrc", dest: ".inputrc" }
  - { src: ".vimrc", dest: ".vimrc" }
  - { src: ".editorconfig", dest: ".editorconfig" }
  - { src: "config/ghostty", dest: ".config/ghostty" }
  - { src: "config/mise", dest: ".config/mise" }

# Ghostty ships themes as files with spaces in the name (`ghostty +list-themes`).
ghostty_theme: "Afterglow"

# ---------------------------------------------------------------------------
# SSH
# ---------------------------------------------------------------------------
ssh_key_type: ed25519
ssh_key_path: "~/.ssh/id_ed25519"
ssh_key_comment: "{{ git_user_email }}"

# Upload the public key to GitHub after Homebrew installs `gh` and 1Password.
# The playbook pauses with the exact `gh auth` commands when gh is not signed in.
ssh_upload_key_to_github: true
ssh_github_key_title: "{{ macos_computer_name }} ssh key"

# ---------------------------------------------------------------------------
# Homebrew
# ---------------------------------------------------------------------------
# `brew upgrade` everything on each run. Off by default so a routine run stays
# fast and predictable; turn on (or use --tags homebrew-upgrade) when you want it.
homebrew_upgrade_all: false

homebrew_taps:
  - mongodb/brew

# Homebrew 6 refuses to load formulae from a third-party tap until you trust it
# -- trusting a tap means letting its Ruby code run during install. Only list
# taps you actually vouch for. mongodb/brew is MongoDB Inc.'s official tap.
homebrew_trusted_taps:
  - mongodb/brew

# CLI tooling. Language runtimes themselves are handled by mise (see below) --
# these are the things that should track the OS, not a project.
homebrew_formulae:
  # --- core toolchain ---
  - git
  - git-lfs
  - gh
  - mise                  # node / ruby / go version manager
  - uv                    # python versions + venvs + tool installs
  - pnpm
  - nvm                   # escape hatch; not loaded by default, see .zprofile
  - rustup                # provides rustc/cargo, do NOT also install `rust`
  - llvm
  - cmake
  - pkgconf
  - autoconf
  - automake
  - libtool

  # --- ruby build dependencies (mise compiles CRuby from source) ---
  - openssl@3
  - readline
  - libyaml
  - gmp

  # --- datastores ---
  - sqlite
  - postgresql@18
  - redis
  - mongodb/brew/mongodb-community
  - mongodb/brew/mongodb-database-tools   # mongodump, mongorestore, mongoimport
  - mongosh                               # the modern mongo shell (core tap)

  # --- containers ---
  - docker
  - docker-compose
  - docker-buildx
  - colima
  - lima

  # --- infrastructure ---
  - ansible
  - ansible-lint
  - mas                   # Mac App Store CLI

  # --- media / docs ---
  - pandoc
  - ffmpeg
  - imagemagick

  # --- system monitoring ---
  - mactop                # Apple Silicon CPU/GPU monitor
  - mole                  # network / tunnel tool

  # --- zsh: completions, suggestions, highlighting ---
  # These are what keep tab-completion rich. .zshrc wires them up.
  - zsh-completions
  - zsh-autosuggestions
  - zsh-syntax-highlighting

  # --- shell quality of life ---
  - bat                   # cat with syntax highlighting
  - eza                   # modern ls
  - fd                    # modern find
  - ripgrep               # modern grep
  - fzf                   # fuzzy finder, powers ctrl-r history search
  - jq
  - yq
  - tree
  - htop
  - wget
  - watch
  - tldr
  - zoxide                # smarter cd
  - git-delta             # better git diffs
  - shellcheck
  - shfmt
  - coreutils

  # --- security / signing ---
  - gnupg
  - pinentry-mac

# GUI applications.
homebrew_casks:
  # --- terminal & editors ---
  - ghostty
  - cursor
  # Obsidian's vault is plain markdown on disk, so nothing here manages notes --
  # this only installs the app.
  - obsidian

  # --- browsers ---
  - brave-browser
  - google-chrome

  # --- communication ---
  - slack
  - discord

  # --- productivity ---
  - claude                # Claude desktop app
  # Stable channel, roughly a week behind. Swap for claude-code@latest to get
  # releases as they ship. Neither cask self-updates: `brew upgrade` does it.
  - claude-code           # Claude Code CLI
  - linear-linear
  - 1password
  - 1password-cli

  # --- media ---
  - spotify
  - screen-studio

  # --- security ---
  - little-snitch

  # --- fonts (Ghostty + powerline glyphs) ---
  - font-jetbrains-mono-nerd-font

# Where casks put their .app bundles.
homebrew_cask_appdir: /Applications

# ---------------------------------------------------------------------------
# Mac App Store
#
# Requires being signed in to the App Store app at least once. IDs can be
# confirmed with `mas search <name>`.
# ---------------------------------------------------------------------------
mas_installed_apps:
  - { id: 497799835, name: "Xcode" }
  - { id: 899247664, name: "TestFlight" }
  # iWork ships preinstalled on new Macs; listed so a wiped machine gets them.
  - { id: 409201541, name: "Pages" }
  - { id: 409203825, name: "Numbers" }
  - { id: 409183694, name: "Keynote" }

mas_upgrade_all: false

# ---------------------------------------------------------------------------
# Language runtimes (mise)
#
# Written to ~/.config/mise/config.toml, then `mise install` materialises them.
# Ruby is compiled from source, so the first run takes a few minutes.
# ---------------------------------------------------------------------------
mise_tools:
  node: "lts"
  ruby: "3.4"
  go: "latest"

# Global npm packages. Left empty on purpose: globals installed against a
# mise-managed node disappear when you change node versions. Prefer `npx`,
# `pnpm dlx`, or a project devDependency.
npm_global_packages: []

# ---------------------------------------------------------------------------
# Python (uv)
# ---------------------------------------------------------------------------
# Interpreters uv downloads and manages. The first entry becomes the global
# default via `uv python pin`.
uv_python_versions:
  - "3.14"
  - "3.13"
  - "3.12"

# Python CLI tools installed into isolated environments with `uv tool install`.
uv_tools:
  - ruff
  - ipython
  - httpie

# ---------------------------------------------------------------------------
# Rust (rustup)
# ---------------------------------------------------------------------------
rustup_default_toolchain: stable
rustup_components:
  - clippy
  - rustfmt
  - rust-analyzer

# ---------------------------------------------------------------------------
# Docker / Colima
# ---------------------------------------------------------------------------
# Start the Colima VM at the end of the run so `docker ps` works immediately.
colima_start: true
colima_cpus: 4
colima_memory_gb: 8
colima_disk_gb: 100
# "vz" is Apple's native Virtualization.framework -- faster than qemu on Apple
# Silicon and required for Rosetta support.
colima_vm_type: vz
colima_rosetta: true

# ---------------------------------------------------------------------------
# Background services (brew services)
#
# All off by default: a laptop should not run three databases at idle. Flip the
# ones you want in config.yml, or start them ad hoc with `brew services start`.
# ---------------------------------------------------------------------------
homebrew_services_started: []
#  - postgresql@18
#  - redis
#  - mongodb-community

# ---------------------------------------------------------------------------
# macOS system preferences
#
# Applied with the osx_defaults module. Set configure_macos_defaults: false to
# skip the lot, or override individual entries in config.yml.
# ---------------------------------------------------------------------------
macos_defaults:
  # --- keyboard: fast repeat, no autocorrect fighting you in code ---
  - { domain: NSGlobalDomain, key: KeyRepeat, type: int, value: 2 }
  - { domain: NSGlobalDomain, key: InitialKeyRepeat, type: int, value: 15 }
  - { domain: NSGlobalDomain, key: ApplePressAndHoldEnabled, type: bool, value: false }
  - { domain: NSGlobalDomain, key: NSAutomaticSpellingCorrectionEnabled, type: bool, value: false }
  - { domain: NSGlobalDomain, key: NSAutomaticCapitalizationEnabled, type: bool, value: false }
  - { domain: NSGlobalDomain, key: NSAutomaticDashSubstitutionEnabled, type: bool, value: false }
  - { domain: NSGlobalDomain, key: NSAutomaticQuoteSubstitutionEnabled, type: bool, value: false }
  - { domain: NSGlobalDomain, key: NSAutomaticPeriodSubstitutionEnabled, type: bool, value: false }

  # --- trackpad ---
  - { domain: NSGlobalDomain, key: "com.apple.swipescrolldirection", type: bool, value: true }
  # Tap to click. macOS stores these as ints, not bools, and needs all three:
  # the built-in trackpad, a paired Magic Trackpad, and the global mouse setting.
  - { domain: "com.apple.AppleMultitouchTrackpad", key: Clicking, type: int, value: 1 }
  - { domain: "com.apple.driver.AppleBluetoothMultitouch.trackpad", key: Clicking, type: int, value: 1 }
  - { domain: NSGlobalDomain, key: "com.apple.mouse.tapBehavior", type: int, value: 1 }

  # --- dialogs & saving ---
  - { domain: NSGlobalDomain, key: NSNavPanelExpandedStateForSaveMode, type: bool, value: true }
  - { domain: NSGlobalDomain, key: PMPrintingExpandedStateForPrint, type: bool, value: true }
  - { domain: NSGlobalDomain, key: NSDocumentSaveNewDocumentsToCloud, type: bool, value: false }

  # --- finder ---
  - { domain: NSGlobalDomain, key: AppleShowAllExtensions, type: bool, value: true }
  - { domain: "com.apple.finder", key: AppleShowAllFiles, type: bool, value: true }
  - { domain: "com.apple.finder", key: ShowPathbar, type: bool, value: true }
  - { domain: "com.apple.finder", key: ShowStatusBar, type: bool, value: true }
  - { domain: "com.apple.finder", key: FXPreferredViewStyle, type: string, value: Nlsv }
  - { domain: "com.apple.finder", key: FXDefaultSearchScope, type: string, value: SCcf }
  - { domain: "com.apple.finder", key: _FXShowPosixPathInTitle, type: bool, value: true }
  - { domain: "com.apple.finder", key: FXEnableExtensionChangeWarning, type: bool, value: false }
  # Don't litter network shares and USB drives with .DS_Store files.
  - { domain: "com.apple.desktopservices", key: DSDontWriteNetworkStores, type: bool, value: true }
  - { domain: "com.apple.desktopservices", key: DSDontWriteUSBStores, type: bool, value: true }

  # --- dock ---
  - { domain: "com.apple.dock", key: autohide, type: bool, value: true }
  - { domain: "com.apple.dock", key: autohide-delay, type: float, value: 0 }
  - { domain: "com.apple.dock", key: autohide-time-modifier, type: float, value: 0.15 }
  - { domain: "com.apple.dock", key: tilesize, type: int, value: 44 }
  - { domain: "com.apple.dock", key: show-recents, type: bool, value: false }
  - { domain: "com.apple.dock", key: mru-spaces, type: bool, value: false }

  # --- screenshots ---
  - { domain: "com.apple.screencapture", key: location, type: string, value: "~/Desktop/Screenshots" }
  - { domain: "com.apple.screencapture", key: type, type: string, value: png }
  - { domain: "com.apple.screencapture", key: disable-shadow, type: bool, value: true }

  # --- misc ---
  - { domain: "com.apple.LaunchServices", key: LSQuarantine, type: bool, value: false }
  - { domain: "com.apple.CrashReporter", key: DialogType, type: string, value: none }
  - { domain: "com.apple.print.PrintingPrefs", key: "Quit When Finished", type: bool, value: true }

# Directory the screenshot preference above points at.
macos_screenshot_dir: "~/Desktop/Screenshots"
