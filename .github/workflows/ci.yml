---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a collection or module deprecation surfaces before a rebuild day.
    - cron: "0 14 * * 1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ansible and linters.
        run: pip install ansible ansible-lint yamllint

      - name: Install collections.
        run: ansible-galaxy install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax check
        run: ansible-playbook main.yml --syntax-check

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the shell scripts.
        run: shellcheck scripts/bootstrap.sh linux/desktop-setup.sh linux/bootstrap.sh

  linux-dry-run:
    name: Linux dry run (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "fedora:latest"]
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      # The script refuses to run as root, so exercise it as a normal user with
      # passwordless sudo -- the same shape as a real desktop.
      - name: Create an unprivileged user.
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq && apt-get install -y -qq sudo curl ca-certificates
          else
            dnf install -y -q sudo curl ca-certificates
          fi
          useradd -m -s /bin/bash tester
          echo "tester ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/tester
          chmod 0440 /etc/sudoers.d/tester

      - name: Dry run.
        run: |
          cp linux/desktop-setup.sh /home/tester/
          chown tester /home/tester/desktop-setup.sh
          sudo -u tester -i ./desktop-setup.sh --dry-run

      - name: Every advertised step is runnable.
        run: |
          cp linux/desktop-setup.sh /home/tester/
          chown tester /home/tester/desktop-setup.sh
          steps=$(sed -n 's/^readonly ALL_STEPS=(\(.*\))$/\1/p' linux/desktop-setup.sh)
          test -n "$steps" || { echo "could not read ALL_STEPS"; exit 1; }
          for s in $steps; do
            echo "--- $s ---"
            sudo -u tester -i ./desktop-setup.sh --only "$s" --dry-run >/dev/null \
              || { echo "step '$s' failed in dry run"; exit 1; }
          done

      - name: Reject an unknown step name.
        run: |
          cp linux/desktop-setup.sh /home/tester/
          chown tester /home/tester/desktop-setup.sh
          if sudo -u tester -i ./desktop-setup.sh --only nope --dry-run; then
            echo "expected a failure for an unknown step" && exit 1
          fi

      # bootstrap.sh needs a terminal for the 1Password and GitHub sign-ins.
      # CI has none, so it must refuse rather than hang waiting on input.
      - name: bootstrap.sh refuses to run without a terminal.
        run: |
          cp linux/bootstrap.sh /home/tester/
          chown tester /home/tester/bootstrap.sh
          chmod +x /home/tester/bootstrap.sh
          out=$(sudo -u tester -i ./bootstrap.sh 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "expected bootstrap.sh to refuse without a tty" && exit 1
          fi
          echo "$out" | grep -q "No terminal available" \
            || { echo "wrong failure message"; exit 1; }
