[defaults]
inventory = inventory
interpreter_python = auto_silent
# Readable multi-line output instead of one long JSON blob per task.
result_format = yaml
display_skipped_hosts = False
retry_files_enabled = False
nocows = True
# Keep collections repo-local rather than in ~/.ansible, so this playbook's
# dependencies are pinned independently of anything else on the machine.
# (With the full `ansible` package installed, its bundled collections already
# satisfy requirements.yml and nothing is written here.)
collections_path = ./galaxy
force_color = True

[ssh_connection]
pipelining = True
